name: NPO list mirror

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch, clean and split the list
        env:
          NPO_SOURCE_URL: ${{ secrets.NPO_SOURCE_URL }}
        run: python scripts/npo_mirror.py
      - name: Commit if something changed
        run: |
          git config user.name "npo-mirror"
          git config user.email "npo-mirror@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no change" || git commit -m "NPO list refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
